<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Julia的秘书一号</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&family=Noto+Serif+SC:wght@300;400&display=swap');
:root{--bk:#0a0a0a;--wh:#f5f5f3;--g1:#1a1a1a;--g2:#2a2a2a;--g3:#404040;--g4:#6a6a6a;--g5:#9a9a9a;--bd:#222}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bk);color:var(--wh);font-family:'DM Sans',sans-serif;font-size:14px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd);flex-shrink:0}
.hdr-t{font-family:'EB Garamond',serif;font-size:18px;letter-spacing:.04em}
.hdr-s{font-size:10px;color:var(--g4);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.hdr-r{display:flex;gap:6px}
.hbtn{width:32px;height:32px;background:none;border:1px solid var(--bd);color:var(--g4);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:'DM Sans',sans-serif}
.hbtn:hover,.hbtn.on{border-color:var(--g3);color:var(--wh)}
.body{display:flex;flex:1;overflow:hidden;height:calc(100vh - 57px)}
.rd{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.rd.pushed{margin-right:300px}
.uscreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;gap:14px}
.u-mk{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--g4)}
.u-ti{font-family:'EB Garamond',serif;font-size:34px;color:var(--wh);line-height:1.2}
.u-de{font-size:12px;color:var(--g4);line-height:1.9;max-width:260px}
.u-zo{width:100%;max-width:280px;border:1px solid var(--bd);padding:22px;cursor:pointer;transition:border-color .2s;display:flex;flex-direction:column;align-items:center;gap:8px}
.u-zo:hover{border-color:var(--g3)}
.u-zi{font-size:22px;color:var(--g4)}
.u-zt{font-size:13px;color:var(--g5)}
.u-zs{font-size:11px;color:var(--g4)}
#fi{display:none}
.rbtn{font-size:12px;color:var(--g4);background:none;border:1px solid var(--bd);padding:8px 20px;cursor:pointer;letter-spacing:.1em;transition:all .15s;font-family:'DM Sans',sans-serif}
.rbtn:hover{color:var(--wh);border-color:var(--g3)}
.txtarea{width:100%;max-width:280px;background:none;border:1px solid var(--bd);color:var(--wh);padding:10px;font-size:12px;font-family:'DM Sans',sans-serif;resize:none;height:72px;outline:none;margin-top:4px}
.txtarea::placeholder{color:var(--g4)}
.anabtn{font-size:11px;color:var(--g4);background:none;border:1px solid var(--bd);padding:6px 16px;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.08em;transition:all .15s}
.anabtn:hover{color:var(--wh);border-color:var(--g3)}
.sw{border-bottom:1px solid var(--bd)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer}
.sl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--g4)}
.st{font-size:11px;color:var(--g4);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.sb{padding:0 18px 18px}
.s-ti{font-family:'EB Garamond',serif;font-size:24px;margin-bottom:6px;line-height:1.3}
.s-su{font-size:11px;letter-spacing:.1em;color:var(--g4);text-transform:uppercase;margin-bottom:14px}
.s-tx{font-size:13px;color:var(--g5);line-height:1.9;margin-bottom:14px}
.s-co{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.s-tg{font-size:11px;padding:3px 10px;border:1px solid var(--bd);color:var(--g5);letter-spacing:.06em}
.s-qu{font-family:'EB Garamond',serif;font-size:16px;font-style:italic;color:var(--g5);padding:12px 14px;border-left:1px solid var(--g3)}
.aws{display:flex;gap:10px;overflow-x:auto;padding:14px 18px;border-bottom:1px solid var(--bd);scrollbar-width:none}
.aws::-webkit-scrollbar{display:none}
.aw{flex-shrink:0;width:110px}
.ai{width:110px;height:80px;background:var(--g1);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--g4);text-align:center;padding:6px;background-size:cover;background-position:center}
.ac{padding:5px 0;font-size:10px;color:var(--g4);line-height:1.5}
.ct{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.cbtn{font-size:11px;padding:5px 12px;background:none;border:1px solid var(--bd);color:var(--g4);cursor:pointer;letter-spacing:.08em;transition:all .15s;font-family:'DM Sans',sans-serif}
.cbtn:hover{color:var(--wh);border-color:var(--g3)}
.cbtn.on{color:var(--wh);border-color:var(--g5)}
.vc{margin-left:auto;font-size:11px;color:var(--g4);letter-spacing:.08em}
.vc span{color:var(--wh)}
.ctx{padding:20px 18px 100px;font-family:'EB Garamond',serif;font-size:19px;line-height:2;color:var(--wh)}
.ctx p{margin-bottom:1.4em}
.ctx h1{font-size:22px;font-weight:400;margin:2em 0 .6em}
.ctx h2{font-size:11px;font-weight:400;color:var(--g5);margin:1.6em 0 .5em;letter-spacing:.1em;text-transform:uppercase;font-family:'DM Sans',sans-serif}
.w{cursor:pointer;border-bottom:1px solid transparent;transition:border-color .1s}
.w:hover{border-bottom-color:var(--g4)}
.w.sel{border-bottom:1px solid var(--wh)}
.w.done{border-bottom:1px solid var(--g3);color:var(--g4)}
.pop{position:fixed;z-index:200;background:var(--g1);border:1px solid var(--g2);padding:16px;width:248px;box-shadow:0 12px 40px rgba(0,0,0,.8);display:none}
.pop.on{display:block}
.pw{font-family:'EB Garamond',serif;font-size:22px;margin-bottom:1px}
.pp{font-size:11px;color:var(--g4);margin-bottom:8px;font-style:italic}
.pz{font-family:'Noto Serif SC',serif;font-size:16px;color:var(--wh);margin-bottom:4px}
.ps{font-size:11px;color:var(--g4);margin-bottom:12px;line-height:1.7}
.pa{display:flex;gap:6px}
.pb{flex:1;padding:7px 0;font-size:11px;letter-spacing:.08em;border:1px solid var(--bd);background:none;color:var(--g5);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.pb:hover{color:var(--wh);border-color:var(--g3)}
.pb.on{color:var(--wh);border-color:var(--g5)}
.vdr{position:fixed;bottom:0;left:0;right:0;background:var(--g1);border-top:1px solid var(--bd);z-index:150;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:60vh;overflow-y:auto}
.vdr.on{transform:translateY(0)}
.vh{padding:16px 18px 10px;border-bottom:1px solid var(--bd)}
.vt{font-family:'EB Garamond',serif;font-size:20px}
.vs{font-size:11px;color:var(--g4);margin-top:2px;letter-spacing:.06em}
.vl{padding:10px 18px;display:flex;flex-direction:column;gap:0}
.vr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.vr.done{opacity:.4}
.vw{font-family:'EB Garamond',serif;font-size:18px;flex:1}
.vz{font-size:12px;color:var(--g5);flex:1;font-family:'Noto Serif SC',serif}
.va{display:flex;gap:4px}
.vb{width:28px;height:28px;background:none;border:1px solid var(--bd);color:var(--g4);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.vb:hover{color:var(--wh);border-color:var(--g3)}
.ve{padding:24px 0;text-align:center;font-size:12px;color:var(--g4)}
.endbtn{width:calc(100% - 36px);margin:10px 18px 18px;padding:12px;background:none;border:1px solid var(--g3);color:var(--g5);font-size:12px;letter-spacing:.1em;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.endbtn:hover{color:var(--wh);border-color:var(--g4)}
.cp{position:fixed;top:57px;right:0;bottom:0;width:300px;background:var(--bk);border-left:1px solid var(--bd);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:100}
.cp.on{transform:translateX(0)}
.cph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd);flex-shrink:0}
.cpt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--g5)}
.cpm{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0}
.cpb{flex:1;padding:9px 4px;font-size:11px;text-align:center;background:none;border:none;border-right:1px solid var(--bd);color:var(--g4);cursor:pointer;letter-spacing:.05em;font-family:'DM Sans',sans-serif;transition:all .15s}
.cpb:last-child{border-right:none}
.cpb.on{color:var(--wh);background:var(--g1)}
.cms{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.mg{font-size:13px;line-height:1.7;padding:10px 12px;max-width:94%}
.mg-ai{background:var(--g1);border:1px solid var(--bd);align-self:flex-start;border-radius:0 6px 6px 6px;color:var(--wh)}
.mg-us{background:none;border:1px solid var(--g3);align-self:flex-end;border-radius:6px 0 6px 6px;color:var(--g5)}
.cir{display:flex;border-top:1px solid var(--bd);flex-shrink:0}
.cin{flex:1;background:none;border:none;padding:12px 14px;font-size:13px;color:var(--wh);font-family:'DM Sans',sans-serif;outline:none;resize:none;max-height:80px;overflow-y:auto}
.cin::placeholder{color:var(--g4)}
.csend{width:44px;background:none;border:none;border-left:1px solid var(--bd);color:var(--g4);font-size:16px;cursor:pointer;transition:color .15s}
.csend:hover{color:var(--wh)}
.dots span{display:inline-block;width:4px;height:4px;background:var(--g4);border-radius:50%;margin:0 2px;animation:bc 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes bc{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.lov{position:fixed;inset:0;background:var(--bk);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.lov.on{display:flex}
.sp{width:22px;height:22px;border:1px solid var(--g3);border-top-color:var(--wh);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lt{font-size:12px;color:var(--g4);letter-spacing:.1em;text-align:center;max-width:220px;line-height:1.8}
.tst{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--g1);border:1px solid var(--g3);color:var(--g5);padding:8px 18px;font-size:12px;z-index:500;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;letter-spacing:.06em}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.key-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;display:flex;align-items:center;justify-content:center}
.key-box{background:var(--g1);border:1px solid var(--bd);padding:28px 24px;width:90%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.key-title{font-family:'EB Garamond',serif;font-size:20px}
.key-sub{font-size:12px;color:var(--g4);line-height:1.8}
.key-link{color:var(--g5);font-size:11px;letter-spacing:.06em}
.key-input{background:none;border:1px solid var(--bd);color:var(--wh);padding:10px 12px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;width:100%}
.key-input:focus{border-color:var(--g3)}
.key-save{padding:10px;background:var(--wh);color:var(--bk);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;letter-spacing:.06em;transition:opacity .15s}
.key-save:hover{opacity:.85}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--g2)}
@media(max-width:600px){.cp{width:100%}.rd.pushed{margin-right:0}}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="hdr-t">Julia的秘书一号</div><div class="hdr-s" id="subTag">上传课程文件</div></div>
  <div class="hdr-r">
    <button class="hbtn" onclick="toggleVdr()">词</button>
    <button class="hbtn" id="chatBtn" onclick="toggleChat()">助</button>
    <button class="hbtn" onclick="showKeySetup()">⚙</button>
  </div>
</div>
<div class="body">
  <div class="rd" id="rd">
    <div class="uscreen" id="uscreen">
      <div><div class="u-mk">Julia's Secretary No.1</div><div class="u-ti">上传今日<br>课堂讲义</div></div>
      <div class="u-de">支持 ePub · TXT · 图片 · 视频<br>AI自动识别科目整理重点<br>数据永久保存随时继续</div>
      <div class="u-zo" onclick="document.getElementById('fi').click()">
        <div class="u-zi">↑</div>
        <div class="u-zt">点击选择文件</div>
        <div class="u-zs">ePub · TXT · 图片 · 视频</div>
      </div>
      <input type="file" id="fi" accept=".epub,.txt,.pdf,.md,.jpg,.jpeg,.png,.mp4,.mov" style="display:none" onchange="handleUpload(event)">
      <textarea class="txtarea" id="textInput" placeholder="或直接粘贴文字内容..."></textarea>
      <button class="anabtn" onclick="handleTextInput()">分析文字内容 →</button>
      <button class="rbtn" id="resumeBtn" style="display:none" onclick="resumeLesson()">继续上次课程 ↗</button>
    </div>
    <div id="lv" style="display:none">
      <div class="sw">
        <div class="sh" onclick="toggleSum()"><span class="sl">课程摘要</span><button class="st" id="stog">收起</button></div>
        <div id="sbody" class="sb">
          <div class="s-ti" id="sTi"></div>
          <div class="s-su" id="sSu"></div>
          <div class="s-tx" id="sTx"></div>
          <div class="s-co" id="sCo"></div>
          <div class="s-qu" id="sQu"></div>
        </div>
      </div>
      <div class="aws" id="aws" style="display:none"></div>
      <div class="ct">
        <button class="cbtn" id="readBtn" onclick="toggleRead()">▶ 朗读</button>
        <button class="cbtn" onclick="stopRead()">■ 停止</button>
        <div class="vc">已选 <span id="vcn">0</span> 词</div>
      </div>
      <div class="ctx" id="ctx"></div>
    </div>
  </div>
  <div class="cp" id="cp">
    <div class="cph"><span class="cpt">学习助手</span><button class="hbtn" onclick="toggleChat()" style="width:26px;height:26px;font-size:11px">✕</button></div>
    <div class="cpm">
      <button class="cpb on" id="cm-tutor" onclick="setMode('tutor')">讲解</button>
      <button class="cpb" id="cm-oral" onclick="setMode('oral')">口语</button>
      <button class="cpb" id="cm-write" onclick="setMode('write')">写作</button>
      <button class="cpb" id="cm-free" onclick="setMode('free')">闲聊</button>
    </div>
    <div class="cms" id="cms"></div>
    <div class="cir">
      <textarea class="cin" id="cin" placeholder="输入问题..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'"></textarea>
      <button class="csend" onclick="sendMsg()">↑</button>
    </div>
  </div>
</div>
<div class="vdr" id="vdr">
  <div class="vh"><div class="vt">词汇本</div><div class="vs" id="vsub">本课 0 词</div></div>
  <div class="vl" id="vlist"></div>
  <button class="endbtn" onclick="endLesson()">结束本课 · 上传下一个讲义</button>
</div>
<div class="pop" id="pop">
  <div class="pw" id="pw"></div>
  <div class="pp" id="pp"></div>
  <div class="pz" id="pz">加载中...</div>
  <div class="ps" id="ps"></div>
  <div class="pa">
    <button class="pb" onclick="spk(curW)">🔊 发音</button>
    <button class="pb" id="padd" onclick="doAdd()">+ 加入词单</button>
  </div>
</div>
<div class="lov" id="lov"><div class="sp"></div><div class="lt" id="lt">分析中...</div></div>
<div class="tst" id="tst"></div>
<div class="key-overlay" id="keyOverlay" style="display:none">
  <div class="key-box">
    <div class="key-title">设置 API Key</div>
    <div class="key-sub">前往 <a href="https://openrouter.ai/keys" target="_blank" class="key-link">openrouter.ai/keys</a> 免费注册获取Key<br>Key只保存在你的设备本地</div>
    <input class="key-input" id="keyInput" type="text" placeholder="sk-or-v1-...">
    <button class="key-save" onclick="saveKey()">保存并开始使用</button>
  </div>
</div>
<script>
const ORU='https://openrouter.ai/api/v1/chat/completions';
const MODELS=['meta-llama/llama-3.3-70b-instruct:free','mistralai/mistral-7b-instruct:free','google/gemini-2.0-flash-exp:free'];
const SBU='https://wbgmyoolenmbvnfeupkll.supabase.co';
const SBK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndiZ215b29lbmJtdm5mZXVwa2xsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MjEyNjcsImV4cCI6MjA5MTI5NzI2N30.i3d4C1p7j1P24UNaa_4GRSq_m3NmvcFzaUvo93FXxgw';
const KEY_NAME='julia_secretary_key_v3';
let lesson=null,vocab=[],chatHist=[],chatMode='tutor',curW='',popD={},sumOpen=true,talking=false,mIdx=0;
const SBH={'apikey':SBK,'Authorization':'Bearer '+SBK,'Content-Type':'application/json'};

function getKey(){
  try{return localStorage.getItem(KEY_NAME)||'';}
  catch(e){return '';}
}
function saveKey(){
  var k=document.getElementById('keyInput').value.trim();
  if(!k||k.length<10){toast('请输入有效的Key');return;}
  try{
    localStorage.setItem(KEY_NAME,k);
    document.getElementById('keyOverlay').style.display='none';
    toast('Key已保存 ✓ 正在初始化...');
    setTimeout(function(){init();},500);
  }catch(e){toast('保存失败: '+e.message);}
}
function showKeySetup(){
  var k=getKey();
  var inp=document.getElementById('keyInput');
  inp.value=k||'';
  inp.type='text';
  document.getElementById('keyOverlay').style.display='flex';
}

async function callAI(msgs){
  var key=getKey();
  if(!key){showKeySetup();throw new Error('请先设置API Key');}
  var h={'Content-Type':'application/json','Authorization':'Bearer '+key};
  var lastErr='';
  for(var i=0;i<MODELS.length;i++){
    var model=MODELS[mIdx%MODELS.length];
    mIdx++;
    try{
      var r=await fetch(ORU,{method:'POST',headers:h,body:JSON.stringify({model:model,messages:msgs,max_tokens:800,temperature:0.7})});
      if(!r.ok){var err=await r.text();throw new Error('HTTP '+r.status+': '+err.slice(0,100));}
      var d=await r.json();
      if(d.error)throw new Error(JSON.stringify(d.error));
      var result=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
      if(result)return result;
      throw new Error('空响应');
    }catch(e){
      lastErr=e.message;
      console.log('模型'+model+'失败: '+e.message);
    }
  }
  throw new Error('所有模型失败。最后错误: '+lastErr);
}

async function sbGet(t,q=''){const r=await fetch(SBU+'/rest/v1/'+t+'?'+q+'&order=created_at.desc',{headers:SBH});return r.json();}
async function sbPost(t,d){const r=await fetch(SBU+'/rest/v1/'+t,{method:'POST',headers:{...SBH,'Prefer':'return=representation'},body:JSON.stringify(d)});return r.json();}
async function sbPatch(t,id,d){await fetch(SBU+'/rest/v1/'+t+'?id=eq.'+id,{method:'PATCH',headers:SBH,body:JSON.stringify(d)});}
async function sbDel(t,f){await fetch(SBU+'/rest/v1/'+t+'?'+f,{method:'DELETE',headers:SBH});}

async function init(){
  if(!getKey()){showKeySetup();return;}
  try{const ls=await sbGet('lessons','is_active=eq.true&limit=1');if(ls&&ls.length)document.getElementById('resumeBtn').style.display='block';}catch(e){}
}
init();

function handleTextInput(){
  var txt=document.getElementById('textInput').value.trim();
  if(!txt||txt.length<10){toast('请输入至少10个字符');return;}
  if(!getKey()){showKeySetup();return;}
  processLesson(txt.slice(0,3000),'手动输入');
}

async function handleUpload(e){
  const file=e.target.files[0];if(!file)return;
  if(!getKey()){showKeySetup();return;}
  showL('读取: '+file.name);
  let text='';
  try{
    if(file.name.endsWith('.epub'))text=await readEpub(file);
    else if(file.type.startsWith('image/'))text='[图片: '+file.name+']';
    else if(file.type.startsWith('video/'))text='[视频: '+file.name+']';
    else text=await file.text();
  }catch(err){hideL();toast('读取失败: '+err.message);return;}
  if(!text||text.length<5){hideL();toast('内容为空');return;}
  await processLesson(text.slice(0,3000),file.name);
}

async function readEpub(file){
  const buf=await file.arrayBuffer();
  const raw=new TextDecoder('utf-8',{fatal:false}).decode(new Uint8Array(buf));
  const bodies=[...raw.matchAll(/<body[^>]*>([\s\S]*?)<\/body>/gi)];
  if(bodies.length){const t=bodies.map(m=>m[1].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ')).join(' ').trim();if(t.length>50)return t;}
  return raw.replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/gi,' ').replace(/\s+/g,' ').trim();
}

async function processLesson(text,filename){
  showL('AI分析中...');
  try{
    const metaRaw=await callAI([
      {role:'system',content:'Analyze university lesson. Return ONLY valid JSON no markdown: {"title":"","subject":"","subject_zh":"","summary_zh":"","summary_en":"","key_concepts":["","","",""],"core_question":"","artworks":[{"artist":"","work":"","year":""}]}'},
      {role:'user',content:'TEXT:\n'+text.slice(0,1500)}
    ]);
    const j1=metaRaw.indexOf('{'),j2=metaRaw.lastIndexOf('}');
    if(j1===-1)throw new Error('格式错误: '+metaRaw.slice(0,100));
    const meta=JSON.parse(metaRaw.slice(j1,j2+1));
    showL('整理正文...');
    const cleaned=await callAI([
      {role:'system',content:'Reformat for reading. Keep original English. Add ## headings. Return plain text only.'},
      {role:'user',content:text.slice(0,2500)}
    ]);
    meta.processed_content=cleaned||text;
    showL('保存...');
    const old=await sbGet('lessons','is_active=eq.true');
    if(old&&old.length)for(const l of old)await sbPatch('lessons',l.id,{is_active:false});
    const saved=await sbPost('lessons',{title:meta.title||filename,subject:(meta.subject||'')+(meta.subject_zh?' · '+meta.subject_zh:''),content:meta.processed_content,summary:JSON.stringify(meta),is_active:true});
    if(!saved||!saved[0])throw new Error('保存失败');
    lesson=saved[0];lesson._m=meta;vocab=[];
    renderLesson(meta);hideL();
    setTimeout(initChat,800);
  }catch(err){hideL();toast('失败: '+err.message);}
}

async function resumeLesson(){
  showL('加载...');
  try{
    const ls=await sbGet('lessons','is_active=eq.true&limit=1');
    if(!ls||!ls.length){hideL();toast('没有保存的课程');return;}
    lesson=ls[0];
    try{lesson._m=JSON.parse(lesson.summary);}catch(e){lesson._m={};}
    vocab=await sbGet('vocab_items','lesson_id=eq.'+lesson.id)||[];
    renderLesson(lesson._m);hideL();
    setTimeout(initChat,800);
  }catch(e){hideL();toast('加载失败: '+e.message);}
}

function renderLesson(m){
  document.getElementById('uscreen').style.display='none';
  document.getElementById('lv').style.display='block';
  document.getElementById('subTag').textContent=m.subject||lesson.subject||'';
  document.getElementById('sTi').textContent=m.title||'';
  document.getElementById('sSu').textContent=(m.subject||'')+(m.subject_zh?' · '+m.subject_zh:'');
  document.getElementById('sTx').innerHTML='<b>EN</b> '+(m.summary_en||'')+'<br><br><b>中</b> '+(m.summary_zh||'');
  document.getElementById('sCo').innerHTML=(m.key_concepts||[]).map(c=>'<span class="s-tg">'+c+'</span>').join('');
  document.getElementById('sQu').textContent=m.core_question?'"'+m.core_question+'"':'';
  if(m.artworks&&m.artworks.length)renderAW(m.artworks);
  renderCtx(m.processed_content||lesson.content||'');
  renderVocab();updateVN();
}

function renderAW(aws){
  const el=document.getElementById('aws');el.style.display='flex';
  el.innerHTML=aws.map((a,i)=>'<div class="aw"><div class="ai" id="ai'+i+'">'+(a.artist||'')+'<br><span style="color:#444">'+(a.year||'')+'</span></div><div class="ac">'+(a.work||'')+'<br>'+(a.artist||'')+'</div></div>').join('');
  aws.forEach((a,i)=>{fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent((a.artist||'').split(' ').pop())).then(r=>r.json()).then(d=>{if(d.thumbnail&&d.thumbnail.source){const el=document.getElementById('ai'+i);if(el){el.style.backgroundImage='url('+d.thumbnail.source+')';el.style.backgroundSize='cover';el.style.backgroundPosition='center';el.innerHTML='';}}}).catch(()=>{});});
}

function renderCtx(md){
  const sel=new Set(vocab.filter(v=>v.selected).map(v=>v.word.toLowerCase()));
  const done=new Set(vocab.filter(v=>v.mastered).map(v=>v.word.toLowerCase()));
  let html=md.replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'</p><p>').replace(/\n/g,' ');
  html='<p>'+html+'</p>';
  html=html.replace(/(<[^>]+>)|([A-Za-z\u00C0-\u024F''\-]+)/g,function(m,tag,word){
    if(tag)return tag;if(!word||word.length<3)return word;
    var lo=word.toLowerCase();
    var cls=done.has(lo)?'w done':sel.has(lo)?'w sel':'w';
    return '<span class="'+cls+'" onclick="clickW(event,\''+lo+'\',\''+word.replace(/'/g,"\\'")+'\')">'+word+'</span>';
  });
  document.getElementById('ctx').innerHTML=html;
}

async function clickW(e,lo,orig){
  e.stopPropagation();curW=lo;
  const ex=vocab.find(v=>v.word.toLowerCase()===lo&&v.selected);
  document.getElementById('pw').textContent=orig;
  document.getElementById('pp').textContent='';
  document.getElementById('pz').textContent=ex?ex.zh:'加载中...';
  document.getElementById('ps').textContent=ex&&ex.synonyms?'近义 · '+ex.synonyms:'';
  const ab=document.getElementById('padd');
  ab.textContent=ex?'✓ 已在词单':'+ 加入词单';
  ab.className='pb'+(ex?' on':'');
  popD={lo,orig,ex};
  const rect=e.target.getBoundingClientRect();
  const pop=document.getElementById('pop');
  pop.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-260))+'px';
  pop.style.top=(rect.bottom+window.scrollY+6)+'px';
  pop.classList.add('on');
  if(!ex)fetchDef(lo,orig);
}

async function fetchDef(lo,orig){
  try{
    const raw=await callAI([
      {role:'system',content:'Return ONLY valid JSON.'},
      {role:'user',content:'Word "'+orig+'" context: '+(lesson&&lesson.subject||'art')+'. JSON: {"phonetic":"/x/ British","zh":"中文2-4字","synonyms":"w1,w2","type":"noun"}'}
    ]);
    const j1=raw.indexOf('{'),j2=raw.lastIndexOf('}');
    if(j1===-1)return;
    const def=JSON.parse(raw.slice(j1,j2+1));
    popD.def=def;
    if(curW===lo&&document.getElementById('pop').classList.contains('on')){
      document.getElementById('pp').textContent=def.phonetic||'';
      document.getElementById('pz').textContent=def.zh||orig;
      document.getElementById('ps').textContent=def.synonyms?'近义 · '+def.synonyms:'';
    }
  }catch(e){document.getElementById('pz').textContent=orig;}
}

async function doAdd(){
  const lo=popD.lo,orig=popD.orig,ex=popD.ex,def=popD.def;
  if(ex){
    await sbDel('vocab_items','id=eq.'+ex.id);
    vocab=vocab.filter(v=>v.id!==ex.id);toast('已移除');
  }else{
    const data={lesson_id:lesson.id,word:orig,phonetic:def?def.phonetic||'':'',zh:def?def.zh||'':'',synonyms:def?def.synonyms||'':'',type:def?def.type||'':'',selected:true,mastered:false,review_count:0};
    const saved=await sbPost('vocab_items',data);
    if(saved&&saved[0])vocab.push(saved[0]);
    toast('已加入: '+orig);
  }
  document.getElementById('pop').classList.remove('on');
  renderCtx(lesson._m?lesson._m.processed_content||lesson.content:lesson.content);
  renderVocab();updateVN();
}

function toggleVdr(){const d=document.getElementById('vdr');d.classList.toggle('on');if(d.classList.contains('on'))renderVocab();}
function renderVocab(){
  const sel=vocab.filter(v=>v.selected);
  document.getElementById('vsub').textContent='本课 '+sel.length+' 词 · '+sel.filter(v=>v.mastered).length+' 已掌握';
  const list=document.getElementById('vlist');
  if(!sel.length){list.innerHTML='<div class="ve">还没有选词<br>点击正文单词添加</div>';return;}
  list.innerHTML=sel.map(v=>'<div class="vr'+(v.mastered?' done':'')+'"><div class="vw">'+v.word+'</div><div class="vz">'+(v.zh||'')+'</div><div class="va"><button class="vb" onclick="spk(\''+v.word+'\')">♪</button><button class="vb" onclick="markDone(\''+v.id+'\')">'+(v.mastered?'↩':'✓')+'</button><button class="vb" onclick="rmW(\''+v.id+'\')">×</button></div></div>').join('');
}
function updateVN(){document.getElementById('vcn').textContent=vocab.filter(v=>v.selected).length;}

async function markDone(id){
  const v=vocab.find(x=>x.id===id);if(!v)return;
  v.mastered=!v.mastered;
  await sbPatch('vocab_items',id,{mastered:v.mastered});
  renderVocab();renderCtx(lesson._m?lesson._m.processed_content||lesson.content:lesson.content);
  toast(v.mastered?'✓ 已掌握':'↩ 取消');
}
async function rmW(id){
  await sbDel('vocab_items','id=eq.'+id);
  vocab=vocab.filter(v=>v.id!==id);
  renderVocab();updateVN();
  renderCtx(lesson._m?lesson._m.processed_content||lesson.content:lesson.content);
}
async function endLesson(){
  if(!lesson)return;
  if(!confirm('结束本课？'))return;
  await sbPatch('lessons',lesson.id,{is_active:false});
  lesson=null;vocab=[];chatHist=[];
  document.getElementById('lv').style.display='none';
  document.getElementById('uscreen').style.display='flex';
  document.getElementById('subTag').textContent='上传课程文件';
  document.getElementById('vdr').classList.remove('on');
  document.getElementById('fi').value='';
  toast('课程已结束');
}

function spk(w){
  if(!w)return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(w);u.lang='en-GB';u.rate=0.82;
  const vs=speechSynthesis.getVoices();
  const gb=vs.find(v=>v.lang==='en-GB')||vs.find(v=>v.name.indexOf('Daniel')>=0||v.name.indexOf('Kate')>=0);
  if(gb)u.voice=gb;speechSynthesis.speak(u);
}
var rIdx=0,rSents=[];
function toggleRead(){
  if(talking){stopRead();return;}talking=true;
  document.getElementById('readBtn').textContent='■ 朗读中';
  document.getElementById('readBtn').classList.add('on');
  var text=document.getElementById('ctx').innerText;
  rSents=text.match(/[^.!?]+[.!?]+/g)||[text];rIdx=0;readNext();
}
function readNext(){
  if(!talking||rIdx>=rSents.length){stopRead();return;}
  var u=new SpeechSynthesisUtterance(rSents[rIdx]);u.lang='en-GB';u.rate=0.8;
  var vs=speechSynthesis.getVoices();
  var gb=vs.find(function(v){return v.lang==='en-GB';})||vs.find(function(v){return v.name.indexOf('Daniel')>=0;});
  if(gb)u.voice=gb;u.onend=function(){rIdx++;readNext();};speechSynthesis.speak(u);
}
function stopRead(){talking=false;speechSynthesis.cancel();document.getElementById('readBtn').textContent='▶ 朗读';document.getElementById('readBtn').classList.remove('on');}
setTimeout(function(){speechSynthesis.getVoices();},300);

function toggleChat(){
  var p=document.getElementById('cp');var r=document.getElementById('rd');
  var on=p.classList.toggle('on');
  document.getElementById('chatBtn').classList.toggle('on',on);
  if(window.innerWidth>600)r.classList.toggle('pushed',on);
  if(on&&!chatHist.length)initChat();
}
function setMode(m){
  chatMode=m;
  document.querySelectorAll('.cpb').forEach(function(b){b.classList.remove('on');});
  document.getElementById('cm-'+m).classList.add('on');
  chatHist=[];document.getElementById('cms').innerHTML='';initChat();
}
function getSys(){
  var subj=lesson?lesson.subject||'art':'art';
  var ctx='';
  if(lesson&&lesson._m){var mm=lesson._m;ctx='课程:"'+(mm.title||'')+'",概念:'+(mm.key_concepts||[]).join(',');}
  var rw=vocab.slice(-8).map(function(v){return v.word;}).join(',')||'aesthetics,phenomenology';
  var P='【学生】Julia，NABA米兰绘画本科一年级，英语B1，ADHD，内向害羞，目标2年内B2/C1口语。科目:'+subj+'。'+ctx+'。近期词汇:'+rw+'。容易受挫需要鼓励。';
  var ps={
    tutor:P+'\n你是热情的艺术哲学教授，中英双语。每次最多4句；中文回答英文术语加括号；一个比喻或作品举例；结尾一个好奇问题。开场：问今天课程最困惑或有趣的部分。',
    oral:P+'\n你是帮助害羞中国艺术生通过口语考试的教练。先热身聊日常，再过渡到艺术，再练习课程概念。等她说完再纠错，最多2个。中文回答时温柔鼓励说英文。开场：轻松问最近生活。',
    write:P+'\n你是写作教练，一句话一句话来。给最简单任务：完成"In this lesson art means ___"或用8词描述一件艺术品。批改：✗原文 ✓修改 💡原因 →下一步。开场：给最简单任务。',
    free:P+'\n你是她在米兰的朋友，中英混搭聊天，3-4句，有趣英文词顺带解释。开场：分享艺术或米兰冷知识。'
  };
  return ps[chatMode]||ps.tutor;
}
async function initChat(){
  if(!getKey())return;
  addDots();
  try{
    var r=await callAI([{role:'system',content:getSys()},{role:'user',content:'开始。'}]);
    removeDots();addMsg('ai',r);chatHist.push({role:'ai',content:r});
  }catch(e){removeDots();addMsg('ai','连接失败: '+e.message);}
}
async function sendMsg(){
  var inp=document.getElementById('cin');var txt=inp.value.trim();if(!txt)return;
  inp.value='';inp.style.height='auto';
  addMsg('user',txt);chatHist.push({role:'user',content:txt});addDots();
  try{
    var msgs=[{role:'system',content:getSys()}];
    chatHist.slice(-16).forEach(function(m){msgs.push({role:m.role==='ai'?'assistant':'user',content:m.content});});
    var r=await callAI(msgs);
    removeDots();addMsg('ai',r);chatHist.push({role:'ai',content:r});
  }catch(e){removeDots();addMsg('ai','出错: '+e.message);}
}
function addMsg(role,text){
  var el=document.getElementById('cms');
  var d=document.createElement('div');d.className='mg mg-'+(role==='ai'?'ai':'us');d.textContent=text;
  el.appendChild(d);el.scrollTop=el.scrollHeight;
}
function addDots(){
  var el=document.getElementById('cms');
  var d=document.createElement('div');d.className='mg mg-ai';d.id='dots';
  d.innerHTML='<div class="dots"><span></span><span></span><span></span></div>';
  el.appendChild(d);el.scrollTop=el.scrollHeight;
}
function removeDots(){var t=document.getElementById('dots');if(t)t.remove();}
function toggleSum(){
  sumOpen=!sumOpen;
  document.getElementById('sbody').style.display=sumOpen?'block':'none';
  document.getElementById('aws').style.display=sumOpen?'flex':'none';
  document.getElementById('stog').textContent=sumOpen?'收起':'展开';
}
function showL(t){document.getElementById('lt').textContent=t;document.getElementById('lov').classList.add('on');}
function hideL(){document.getElementById('lov').classList.remove('on');}
function toast(msg){var t=document.getElementById('tst');t.textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},3000);}
document.addEventListener('click',function(e){
  var p=document.getElementById('pop');
  if(!p.contains(e.target)&&!e.target.classList.contains('w'))p.classList.remove('on');
});
</script>
